<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<link rel="preload" href="assets/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin/>

<body>

  <div class="wrap narrow"><div class="panel prose">
