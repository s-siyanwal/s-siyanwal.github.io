<header class="topbar"><div class="wrap topbar-inner"></div></header>

<main id="main">
  <header class="hero" id="top">
    <div class="wrap">
      <div class="panel hero-panel">
        <img class="portrait" src="assets/portrait.jpg" width="148" height="185" alt="Portrait of Shivanshu Siyanwal" loading="eager" decoding="async"/>
        <div class="hero-lead">
          <h1 id="hero-name"></h1>
          <p class="research-line" id="hero-title"></p>
          <p class="hero-tagline" id="hero-tagline"></p>

        </div>
        <aside class="hero-side" aria-label="Profiles and links">
          <div class="profiles" id="profiles"></div>
        </aside>
      </div>
    </div>
    <div class="wrap">
      <div class="panel hero-instrument">
        <div class="hero-circuit" id="hero-circuit"></div>
        <div class="glance" id="glance"></div>

  <section id="papers" class="section" aria-labelledby="pap-h">

      <div class="section-head" data-reveal>

    </div></div>
  </section>

  <section id="projects" class="section" aria-labelledby="proj-h">
    <div class="wrap"><div class="panel">

        <div class="filter" role="group" aria-label="Filter threads by track">
          <button class="filter-btn is-active" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-btn" data-filter="academic" aria-pressed="false">Research</button>
          <button class="filter-btn" data-filter="industry" aria-pressed="false">Engineering</button>
        </div>
      </div>

    </div></div>

  <section id="work" class="section" aria-labelledby="work-h">

      <div class="section-head" data-reveal>

      <div class="mini-list" id="education-list"></div>

  <section id="awards" class="section" aria-labelledby="aw-h">

      <div class="section-head" data-reveal><h2 id="aw-h">Awards and certifications</h2></div>
      <ul class="awards" id="awards-list"></ul>
